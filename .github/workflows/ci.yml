name: Package and core checks
on:
  push:
  pull_request:
  workflow_call:

permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12']
    env:
      SUNPY_CONFIGDIR: /tmp/spinnme-sunpy
      MPLCONFIGDIR: /tmp/spinnme-matplotlib
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: mkdir -p "$SUNPY_CONFIGDIR" "$MPLCONFIGDIR"
      - run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install '.[dev,download,synthetic]'
      - run: python -m ruff check .
      # Keep push/PR checks focused; run the full scientific suite locally.
      - name: Core configuration, CLI, and synthesis tests
        run: |
          python -m pytest -q \
            tests/test_cli_configuration.py \
            tests/test_cli_workflows.py \
            tests/test_preparation_cache.py \
            tests/test_distributed_startup.py \
            tests/test_colab_notebooks.py \
            tests/test_inversion_api.py \
            tests/test_core_configuration.py \
            tests/test_yaml_overwrites.py \
            tests/test_me_atmosphere.py \
            tests/test_spectral_response.py \
            tests/test_stokes_loss.py
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - name: Test the wheel outside the source checkout
        run: |
          python -m venv --system-site-packages /tmp/spinnme-wheel
          /tmp/spinnme-wheel/bin/pip install --no-deps --ignore-installed dist/*.whl
          cd /tmp
          /tmp/spinnme-wheel/bin/python -c "import sys, spinnme; from pathlib import Path; assert Path(spinnme.__file__).resolve().is_relative_to(Path(sys.prefix).resolve())"
          /tmp/spinnme-wheel/bin/spinnme --version
          /tmp/spinnme-wheel/bin/spinnme --help
          /tmp/spinnme-wheel/bin/spinnme config list
          /tmp/spinnme-wheel/bin/spinnme synthetic --output /tmp/spinnme-example --size 16 --frames 2
          /tmp/spinnme-wheel/bin/spinnme run --config /tmp/spinnme-example/config.yaml --run_path /tmp/spinnme-example/run --work_path /tmp/spinnme-example/run/cache --device cpu
          /tmp/spinnme-wheel/bin/spinnme export /tmp/spinnme-example/run/inversion.pme --all-observations --parameters Brtp Vdop Blos --output /tmp/spinnme-products --format fits
  documentation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r docs/requirements.txt
      - run: sphinx-build -W --keep-going -b html docs /tmp/spinnme-docs
