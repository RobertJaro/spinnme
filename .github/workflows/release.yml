name: Publish release

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  build:
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check tag and package versions agree
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python - <<'PYTHON'
          import ast
          import os
          from pathlib import Path
          import tomllib

          project = tomllib.loads(Path('pyproject.toml').read_text())['project']
          version = project['version']
          tag = os.environ['RELEASE_TAG']
          if tag != f'v{version}':
              raise SystemExit(f'Release tag {tag!r} must equal v{version}')
          module = ast.parse(Path('src/spinnme/__init__.py').read_text())
          runtime = next(ast.literal_eval(node.value) for node in module.body
                         if isinstance(node, ast.Assign)
                         and any(isinstance(t, ast.Name) and t.id == '__version__' for t in node.targets))
          if runtime != version:
              raise SystemExit('Runtime and package metadata versions differ')
          citation_version = next(line.partition(':')[2].strip()
                                  for line in Path('CITATION.cff').read_text().splitlines()
                                  if line.startswith('version:'))
          if citation_version != version:
              raise SystemExit('Citation and package metadata versions differ')
          if f'\n## {version}\n' not in Path('CHANGELOG.md').read_text():
              raise SystemExit('Missing versioned release notes')
          PYTHON
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - name: Record distribution checksums
        working-directory: dist
        run: sha256sum * > ../SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: |
            dist/*
            SHA256SUMS
          if-no-files-found: error

  pypi:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/spinnme/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: artifacts
      - name: Verify distributions
        working-directory: artifacts/dist
        run: sha256sum --check ../SHA256SUMS
      - name: Prepare verified distributions
        run: mv artifacts/dist dist
      - name: Publish to PyPI with Trusted Publishing
        uses: pypa/gh-action-pypi-publish@release/v1

  assets:
    needs: pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: artifacts
      - name: Verify distributions
        working-directory: artifacts/dist
        run: sha256sum --check ../SHA256SUMS
      - name: Attach distributions to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          gh release upload "$RELEASE_TAG" artifacts/dist/* artifacts/SHA256SUMS --clobber
