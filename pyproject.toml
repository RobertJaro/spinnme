[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "spinnme"
version = "0.1.0"
description = "Spherical physics-informed neural Milne–Eddington inversions of solar spectropolarimetry"
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-only"
license-files = ["LICENSE", "THIRD_PARTY.md", "licenses/*.txt"]
authors = [{name = "Robert Jarolim"}]
keywords = ["solar physics", "spectropolarimetry", "Milne-Eddington", "inversion", "neural fields"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Astronomy",
]
dependencies = [
  "numpy>=1.26", "scipy>=1.11", "torch>=2.9,<3", "astropy>=6",
  "sunpy[map]>=6", "pytorch-lightning>=2.6,<3", "zarr>=3.1,<4",
  "PyYAML>=6", "python-dateutil>=2.8", "tqdm>=4.66", "matplotlib>=3.8",
  "filelock>=3.12",
]

[project.optional-dependencies]
download = ["drms>=0.7", "sunpy[net]>=6", "sunpy-soar>=1.10"]
wandb = ["wandb>=0.19"]
synthetic = ["reproject>=0.14"]
docs = ["sphinx>=7.2", "myst-parser>=2", "pydata-sphinx-theme>=0.15", "sphinx-copybutton>=0.5"]
dev = ["pytest>=8", "build>=1", "twine>=5", "ruff>=0.6"]

[project.urls]
Documentation = "https://spinnme.readthedocs.io/en/stable/"
Changelog = "https://github.com/RobertJaro/spinnme/blob/main/CHANGELOG.md"
Repository = "https://github.com/RobertJaro/spinnme"
Issues = "https://github.com/RobertJaro/spinnme/issues"

[project.scripts]
spinnme = "spinnme.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
spinnme = ["configs/**/*.yaml", "instruments/**/*.yaml", "instruments/**/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: short end-to-end tests", "gpu: optional accelerator tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
# Configuration validation consistently exposes ValueError to CLI/API callers.
ignore = ["TRY004"]

[tool.ruff.lint.per-file-ignores]
# Observation fixtures deliberately exercise the timezone-naive UTC time API.
"tests/*.py" = ["DTZ001"]
